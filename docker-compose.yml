services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [mysql, redis]
  worker:
    build: .
    command: php artisan queue:work --tries=3 --timeout=120
    env_file: .env
    depends_on: [mysql, redis]
  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    depends_on: [mysql, redis]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gymcontrol
      MYSQL_ROOT_PASSWORD: root
    volumes: [gymcontrol-db:/var/lib/mysql]
  redis:
    image: redis:7-alpine
  backup:
    image: mysql:8.4
    profiles: ["backup"]
    entrypoint: ["sh", "-c"]
    command: ["mysqldump -hmysql -uroot -proot gymcontrol > /backup/gymcontrol.sql"]
    volumes: [./backups:/backup]
    depends_on: [mysql]
volumes:
  gymcontrol-db:
